org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# The Android Compose sources need more heap than the Gradle daemon.
# TaskRun.execute 很大;CI 上协程+monitor 分析可能栈溢出,加大 daemon 栈
kotlin.daemon.jvmargs=-Xmx5g -Xss8m
android.useAndroidX=true
kotlin.code.style=official
# 真机测试结束后不卸载 App:卸载会丢失无线调试配对(钥匙存在 App 里)和无障碍授权,每次都得重新配对
android.injected.androidTest.leaveApksInstalledAfterRun=true
