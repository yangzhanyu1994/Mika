name: Power key diagnostic APK
on:
  push:
    branches: [test/assistant-power-key]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build side-by-side test APK
        run: ./gradlew :app:assembleDebug -PdevInstall --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: Mika-power-key-diagnostic
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
