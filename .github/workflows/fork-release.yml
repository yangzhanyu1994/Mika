name: Mika Fork Release
on:
  push:
    tags:
      - "v*"
  create:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.1.41"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MIKA_FORK_KEYSTORE_BASE64: ${{ secrets.MIKA_FORK_KEYSTORE_BASE64 }}
      MIKA_FORK_STORE_PASSWORD: ${{ secrets.MIKA_FORK_STORE_PASSWORD }}
      MIKA_FORK_KEY_ALIAS: ${{ secrets.MIKA_FORK_KEY_ALIAS }}
      MIKA_FORK_KEY_PASSWORD: ${{ secrets.MIKA_FORK_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Resolve version and signing key
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            TAG="${GITHUB_REF_NAME#release/}"
            VERSION="${TAG#v}"
          else
            VERSION="${INPUT_VERSION#v}"
            TAG="v$VERSION"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH, for example 0.1.41"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if (( MINOR >= 1000 || PATCH >= 1000 )); then
            echo "::error::This release scheme requires MINOR and PATCH to stay below 1000"
            exit 1
          fi
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          for name in MIKA_FORK_KEYSTORE_BASE64 MIKA_FORK_STORE_PASSWORD MIKA_FORK_KEY_ALIAS MIKA_FORK_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the repository Actions secret $name before publishing a signed update"
              exit 1
            fi
          done
          printf '%s' "$MIKA_FORK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mika-fork-release.p12"
          chmod 600 "$RUNNER_TEMP/mika-fork-release.jks"
          echo "MIKA_FORK_KEYSTORE=$RUNNER_TEMP/mika-fork-release.jks" >> "$GITHUB_ENV"
          echo "MIKA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MIKA_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "MIKA_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Build signed fork APKs
        run: ./gradlew :app:assembleForkRelease -PmikaVersionName="$MIKA_VERSION" -PmikaVersionCode="$MIKA_VERSION_CODE" -PmikaBeta=false --stacktrace
      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/forkRelease"
          UNIVERSAL="$(find "$APK_DIR" -type f -iname '*universal*.apk' -print -quit)"
          ARM64="$(find "$APK_DIR" -type f -iname '*arm64-v8a*.apk' -print -quit)"
          test -n "$UNIVERSAL" && test -n "$ARM64"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify "$UNIVERSAL"
          "$APKSIGNER" verify "$ARM64"
          mkdir -p release-assets
          cp "$UNIVERSAL" "release-assets/Mika-v$MIKA_VERSION.apk"
          cp "$ARM64" "release-assets/Mika-v$MIKA_VERSION-arm64.apk"
      - name: Publish GitHub Release
        run: gh release create "$MIKA_RELEASE_TAG" release-assets/*.apk --repo "$GITHUB_REPOSITORY" --title "Mika Fork $MIKA_RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"
