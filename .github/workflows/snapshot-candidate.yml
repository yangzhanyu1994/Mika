name: Generate candidate snapshots
on:
  pull_request:
    paths:
      - '.github/workflows/snapshot-candidate.yml'
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Generate and check snapshots
        env:
          UPDATE_GOLDEN: '1'
        run: ./gradlew :core:test --tests '*LoopScenarioTest' --tests '*PromptSurfaceTest' --tests '*PromptLayoutTest' --tests '*SystemPromptAssemblyTest' -PupdateSnapshots
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-snapshots
          path: core/src/test/resources
          retention-days: 7
