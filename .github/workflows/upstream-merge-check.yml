name: Check upstream merge
on:
  push:
    branches: ["test/upstream-merge-check"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test merge without modifying remote
        run: |
          git config user.name "Integration Check"
          git config user.email "integration-check@example.invalid"
          git remote add upstream https://github.com/wangzan101/Mika.git
          git fetch --no-tags upstream 399b4b00de3874e10ff08188becbd245b89884bb
          git merge --no-commit --no-ff FETCH_HEAD || true
          echo '--- CONFLICTS ---'
          git diff --name-only --diff-filter=U
          echo '--- CONFLICT COUNT ---'
          git diff --name-only --diff-filter=U | wc -l
